  <defs>
    <linearGradient id="markBg" x1="76" y1="56" x2="428" y2="444" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B2E3D"/>
      <stop offset="1" stop-color="#101923"/>
    </linearGradient>
    <linearGradient id="pivotLine" x1="236" y1="132" x2="236" y2="374" gradientUnits="userSpaceOnUse">
